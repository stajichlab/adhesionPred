name: CI/build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff 0.3.5, same version as pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.3.5
      - run: ruff check .
      - run: ruff format --check .

  test-sorting-hat:
    name: Unit tests (tests/cellsurface_sorting_hat and tests/class_table, no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # These suites import only the standard library, numpy and pyyaml (checked: no torch, esm or sklearn),
      # so the package is not installed; src/ is put on the path instead.
      - run: pip install pytest pyyaml numpy
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest tests/cellsurface_sorting_hat tests/class_table

  analysis-tests:
    name: Analysis tests (${{ matrix.suite }}, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # One pytest process per folder: each conftest.py puts its own analysis/ directory on
        # sys.path, and module names such as figures_ext exist in more than one of them.
        suite: [step1_compare, hydrophobin_truth, fungi_scan, calibration_truth, cys_candidates, lectin_class_report, lectin_validation, secretome_discovery, wall_fusion_report, wall_fusion_truth]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Cache ESM-2 8M weights (tests/step1_compare/test_esm_embed.py)
        if: matrix.suite == 'step1_compare'
        uses: actions/cache@v6
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: esm2-t6-8M-UR50D-v1
      - run: pytest tests/${{ matrix.suite }}
