name: CI/build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff 0.3.5, same version as pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.3.5
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Unit tests (tests/adhesion_predict, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm needs tags to compute the version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch first so pip does not pull the CUDA wheels
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Cache ESM-2 8M weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: esm2-t6-8M-UR50D-v1
      - name: Run tests
        run: pytest tests/adhesion_predict

  analysis-tests:
    name: Analysis tests (informational, not required)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Run tests outside tests/adhesion_predict
        run: pytest tests --ignore=tests/adhesion_predict
