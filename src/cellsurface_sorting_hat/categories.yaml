# cellsurface_sorting_hat: category rules (version 1). See
# docs/superpowers/specs/2026-10-04-orchestrator-design.md section 3.4.
#
# Node kinds:
#   {call: MODULE}                  the module's `call` column (called / not_called)
#   {flag: MODULE.FIELD}            a 1/0 field
#   {test: {module, field, op, value}}   a number compared with value; "$name" reads `thresholds`
#   {ref: CALL}                     another call (same step 1 variant if that call is per_variant)
#   {and: [...]}, {or: [...]}, {not: NODE}
# `{step1}` in a module name is replaced by the step 1 variant module for per_variant calls.
# A field that is empty, or a module whose state is not `ok`, gives not_assessable.
# A module row with state `not_applicable` gives not_applicable (a leaf call); it acts as not_called in
# and/or and is skipped in the mechanism list of an `other` call.
#
# species_limited (optional): MODULE: [NCBI taxon IDs]. A module in this block applies only to the
# listed taxa (exact match, not lineage). When a run has NO table for such a module, a leaf that
# reads it is `not_applicable` for a protein whose taxon is not in the list, and `not_assessable` for
# a protein whose taxon is in the list. When the table exists, its rows decide. Each name must be a
# module that a call reads. Each value is a non-empty list of integers.

version: 1
default_gate: "step1_rule@R0"
step1_variants: ["step1_rule@R0", "step1_rule@R1", "step1_rule@R2", "step1_ml@card"]

species_limited:
  antigen_lookup: [246410]  # Coccidioides immitis RS

thresholds:
  antigen_percentile_max: 15
  allergen_hit_identity_min: 35
  allergen_hit_length_min: 80
  disorder_run_min: 200
  allergen_identity_min: 70
  allergen_coverage_min: 80

# Fields copied to evidence.tsv.gz when the module row is `ok` and the field is not empty.
evidence:
  - antigen_lookup.percentile
  - antigen_lookup.antigenicity
  - antigen_lookup.specificity
  - antigen_lookup.prevalence
  - antigen_lookup.max_crossreact
  - allergen_homology.allergen_name
  - allergen_homology.allergen_species
  - allergen_homology.exposure
  - allergen_homology.evidence
  - allergen_homology.identity
  - allergen_homology.coverage
  - allergen_homology.aligned_length
  - cys_rich.tier
  - expression.log2fc
  - tm.n_tm
  - tm.n_tm_mature
  - pfam_adhesion.families
  - pfam_hydrophobin.families
  - pfam_hsba.families
  - gpi.confidence_class
  - disorder.longest_run
  - aga1_model.threshold_clade
  - aga1_model.calibrated

calls:
  - name: signal_peptide_protein
    per_variant: true
    expr: {call: "{step1}"}
  - name: tandem_repeat_protein
    expr:
      or: [{call: repeat02}, {call: repeat14}]
  - name: wall_family_domain
    expr: {flag: pfam_adhesion.hit}
  # Only families with a specificity tier of smoke or better and narrow_ok=yes (owner sign-off in
  # data/sorting_hat/family_table.tsv). It implies wall_family_domain.
  - name: wall_family_narrow_domain
    expr: {flag: pfam_adhesion.hit_narrow}
  - name: hydrophobin_domain
    expr: {flag: pfam_hydrophobin.hit}
  - name: hsba_domain
    expr: {flag: pfam_hsba.hit}
  - name: cell_wall_adhesion_candidate
    per_variant: true
    expr:
      and:
        - or: [{ref: tandem_repeat_protein}, {ref: wall_family_narrow_domain}]
        - {ref: signal_peptide_protein}
  # Broader than cell_wall_adhesion_candidate: a secreted protein with any evidence of a surface-attachment mechanism.
  # basis_calls names the evidence calls that held; they are written to the basis column of calls.long.
  # adhesin repeat: tandem_repeat_protein. adhesion or wall family domain: wall_family_domain.
  # surface-active (adsorption, not ligand binding): hydrophobin_domain and hsba_domain.
  - name: surface_attachment_candidate
    per_variant: true
    basis_calls: [tandem_repeat_protein, wall_family_domain, hydrophobin_domain, hsba_domain]
    expr:
      and:
        - or: [{ref: tandem_repeat_protein}, {ref: wall_family_domain}, {ref: hydrophobin_domain}, {ref: hsba_domain}]
        - {ref: signal_peptide_protein}
  # AGA1 class (Ser/Thr-rich, GPI-anchored wall proteins). The wrappers are gpi, disorder and aga1_model (modules/). The engine reads them like any
  # module; the model thresholds come from data/sorting_hat/aga1_model_thresholds.tsv through the aga1_model wrapper, not from here.
  - name: gpi_anchored_protein
    expr: {call: gpi}
  - name: long_disordered_protein
    expr:
      test: {module: disorder, field: longest_run, op: ">=", value: "$disorder_run_min"}
  - name: gpi_long_disorder_protein
    expr:
      and:
        - {call: gpi}
        - test: {module: disorder, field: longest_run, op: ">=", value: "$disorder_run_min"}
  - name: ser_thr_gpi_wall_candidate
    per_variant: true
    expr:
      and: [{ref: signal_peptide_protein}, {ref: gpi_long_disorder_protein}]
  - name: flocculin_like_candidate
    per_variant: true
    expr:
      and: [{ref: ser_thr_gpi_wall_candidate}, {call: repeat14}]
  - name: model_surface_candidate
    per_variant: true
    expr:
      and: [{call: aga1_model}, {ref: signal_peptide_protein}]
  - name: cocci_specificity_rank_top15
    expr:
      test: {module: antigen_lookup, field: percentile, op: "<=", value: "$antigen_percentile_max"}
  - name: serodiagnostic_marker_candidate
    per_variant: true
    expr:
      and: [{ref: cocci_specificity_rank_top15}, {ref: signal_peptide_protein}]
  - name: iuis_allergen_similarity
    expr:
      and:
        - test: {module: allergen_homology, field: identity, op: ">=", value: "$allergen_hit_identity_min"}
        - test: {module: allergen_homology, field: aligned_length, op: ">=", value: "$allergen_hit_length_min"}
  - name: iuis_allergen_homolog
    expr:
      or:
        - and:
            - test: {module: allergen_homology, field: identity, op: ">=", value: "$allergen_identity_min"}
            - test: {module: allergen_homology, field: coverage, op: ">=", value: "$allergen_coverage_min"}
        - {flag: pfam_allergen.hit}
  - name: other_not_surface
    per_variant: true
    kind: other
    surface: signal_peptide_protein
    surface_is: not_called
    mechanism: [tandem_repeat_protein, wall_family_domain, hydrophobin_domain, hsba_domain, cocci_specificity_rank_top15]
  - name: other_surface_no_mechanism
    per_variant: true
    kind: other
    surface: signal_peptide_protein
    surface_is: called
    mechanism: [tandem_repeat_protein, wall_family_domain, hydrophobin_domain, hsba_domain, cocci_specificity_rank_top15]
