# One description per call of src/cellsurface_sorting_hat/categories.yaml (a test checks both directions).
# Kept outside categories.yaml on purpose: an edit of that file, a comment included, changes its hash and makes the call status files stale.
# status_files cite committed files only. Statuses hold per species and taxon and only where the status file is installed and current.
# Written 2026-10-09 (M2 of docs/superpowers/specs/2026-10-09-v1-class-list-design.md). Describes the state of PR #77.
calls:
  - call: signal_peptide_protein
    kind: evidence
    gated: true
    category: surface glycoprotein
    meaning: SignalP 6 predicts a signal peptide (rule R0). Nothing more is claimed.
    reads: [step1_rule@R0]
    status: "estimated in A. nidulans (taxon 162425); smoke in taxa 4932, 5476, 746128, 5207 and 5270; unvalidated elsewhere. The R0 status file of 2026-10-17 is committed (docs/reports/data/sorting_hat/call_status/R0/step1_rule@R0.json); the report is cited."
    status_files:
      - docs/reports/data/sorting_hat/call_status/R0/step1_rule@R0.json
      - docs/reports/2026-10-07-sorting-hat-run-and-calibration.md
  - call: tandem_repeat_protein
    kind: evidence
    gated: false
    category: cell wall and adhesion
    meaning: One of two period detectors finds a tandem array (period above 0, coverage 0.25 or more, 2.5 copies or more). It also fires for intracellular repeat proteins.
    reads: [repeat02, repeat14]
    status: "smoke where the call file is current: S288C sensitivity 0.435 [0.067, 0.667], specificity 0.987; C. albicans 0.462 [0.000, 0.788], 0.976. Stale after any edit of categories.yaml. The two config-of-2026-10-17-pr3 files hold these values (negatives assumed, leakage tuned on truth); they are stale after issue #93 until the refresh is run again."
    status_files:
      - docs/reports/data/sorting_hat/call_status/Scer_S288C/tandem_repeat_protein.owner_definition.config-of-2026-10-17-pr3.json
      - docs/reports/data/sorting_hat/call_status/Calb_SC5314/tandem_repeat_protein.owner_definition.config-of-2026-10-17-pr3.json
      - docs/reports/data/sorting_hat/call_status/Scer_S288C/tandem_repeat_protein.owner_definition.config-with-family-evidence.json
      - docs/reports/data/sorting_hat/call_status/Calb_SC5314/tandem_repeat_protein.owner_definition.config-with-family-evidence.json
  - call: wall_family_domain
    kind: evidence
    gated: false
    category: cell wall and adhesion
    meaning: "A hit to an active wall-family Pfam model that passes that family's condition (the active `pfam_adhesion` rows of `data/sorting_hat/family_table.tsv` are read: {active_families}; `active` means enabled by the owner, not tested; conditions: CFEM no mature TM helix, PA14 R0 signal peptide, which makes this ungated call depend on R0; the other active rows have none). Feeds `surface_attachment_candidate` and the `other_*` calls."
    reads: [pfam_adhesion]
    status: unvalidated
  - call: wall_family_narrow_domain
    kind: evidence
    gated: false
    category: cell wall and adhesion
    meaning: "A hit to a wall-family Pfam model whose row has a specificity tier of smoke or better and narrow_ok=yes (owner sign-off with evidence in `data/sorting_hat/family_table.tsv`). Families read now: {narrow_families}. It implies `wall_family_domain`. Feeds `cell_wall_adhesion_candidate`."
    reads: [pfam_adhesion]
    status: unvalidated
  - call: hydrophobin_domain
    kind: evidence
    gated: false
    category: cell wall and adhesion (surface-active)
    meaning: A hit to one of seven hydrophobin-class Pfam models at the gathering cutoff.
    reads: [pfam_hydrophobin]
    status: "smoke in 8 proteomes (3 to 7 positives each; negatives assumed)."
    status_files:
      - docs/reports/data/sorting_hat/call_status/hydrophobin/pfam_hydrophobin.Afum_Af293_UniProt.json
      - docs/reports/2026-10-08-hydrophobin-validation.md
  - call: hsba_domain
    kind: evidence
    gated: false
    category: cell wall and adhesion
    meaning: "A hit to the HsbA family (PF12296). The family holds the A. fumigatus wall galactomannoproteins Afmp1 and Afmp2 (Mp1p type, GPI-anchored), so read it as a wall-family hit and not as a surface-active (hydrophobin-like) call. It is still evaluated and combined as it was (the config and the frozen family table are not changed); see docs/reports/data/aga1_hsba_note_2026-10-26/README.md."
    reads: [pfam_hsba]
    status: unvalidated (no truth set)
  - call: cell_wall_adhesion_candidate
    kind: composite
    gated: true
    category: cell wall and adhesion
    meaning: Signal peptide and (repeat or narrow wall-family domain).
    reads: [step1_rule@R0, repeat02, repeat14, pfam_adhesion]
    status: derived from the leaf calls that decided each record
  - call: surface_attachment_candidate
    kind: composite
    gated: true
    category: cell wall and adhesion
    meaning: Signal peptide and any of repeat, wall-family domain, hydrophobin or HsbA. The basis column names the evidence that held.
    reads: [step1_rule@R0, repeat02, repeat14, pfam_adhesion, pfam_hydrophobin, pfam_hsba]
    status: derived from the leaf calls that decided each record
  - call: gpi_anchored_protein
    kind: evidence
    gated: false
    category: cell wall and adhesion
    meaning: PredGPI calls a GPI anchor (estimated false positive rate of 0.01 or less; the confidence class is in the evidence). A protein of 40 residues or fewer is not scored by PredGPI and is not assessable. A GPI anchor is not shown to place the protein in the cell wall.
    reads: [gpi]
    status: "smoke in taxa 4932 and 5476: agreement of the PredGPI call with the UniProt GPI-anchor feature on the labelled proteins of the proteome (S. cerevisiae 58 positives, sensitivity 0.966, specificity 0.965; C. albicans 93 positives, 0.903, 0.962); absence of the feature is an assumed negative and leakage is unknown. Unvalidated elsewhere. The status files are valid for the config of 2026-10-26 only."
    status_files:
      - docs/reports/data/sorting_hat/call_status/aga1_850/Scer_S288C/gpi.json
      - docs/reports/data/sorting_hat/call_status/aga1_850/Calb_SC5314/gpi.json
  - call: long_disordered_protein
    kind: evidence
    gated: false
    category: cell wall and adhesion
    meaning: "AIUPred finds a run of at least 200 consecutive residues with a score of 0.5 or more (`thresholds.disorder_run_min`). Disorder is not shown to be a Ser/Thr-rich stalk, and long disordered proteins are common inside the cell."
    reads: [disorder]
    status: unvalidated (no truth set for the property)
  - call: gpi_no_internal_tm_protein
    kind: evidence
    gated: false
    category: cell wall and adhesion
    meaning: A GPI-anchor call and no transmembrane helix other than the C-terminal one. PredGPI can take the last helix of a membrane protein for a GPI signal; a GPI wall protein has no mature helix except its own C-terminal signal, so a helix that ends more than 30 residues before the C-terminus rules the GPI call out.
    reads: [gpi, tm]
    status: unvalidated (no truth set for the combination)
  - call: gpi_long_disorder_protein
    kind: evidence
    gated: false
    category: cell wall and adhesion
    meaning: A GPI-anchor call with no internal transmembrane helix (as `gpi_no_internal_tm_protein`) and a disordered run of 200 residues or more in the same protein. It is the part of the broad AGA1-class rule that does not need the signal peptide.
    reads: [gpi, tm, disorder]
    status: "smoke in taxa 4932 (8 tier A against 265 negatives: sensitivity 0.75 [0.33, 1.00], specificity 0.985) and 5476 (10 against 117: 0.90 [0.00, 1.00], 0.940): agreement of the property combination with the AGA1 class labels, not a measure of the property; the 200-residue cut was chosen on these proteins (leakage tuned_on_truth). Unvalidated elsewhere. Valid for the config of the status files only (re-measured 2026-10-26 after the internal-TM rule)."
    status_files:
      - docs/reports/data/sorting_hat/call_status/aga1_850/Scer_S288C/calls/gpi_long_disorder_protein.json
      - docs/reports/data/sorting_hat/call_status/aga1_850/Calb_SC5314/calls/gpi_long_disorder_protein.json
      - docs/reports/data/aga1_sorting_hat_acceptance_2026-10-26/README.md
  - call: ser_thr_gpi_wall_candidate
    kind: composite
    gated: true
    category: cell wall and adhesion
    meaning: "The broad AGA1-class flag: signal peptide and a GPI-anchor call and a disordered run of 200 residues or more. It finds Ser/Thr-rich GPI wall proteins in general (flocculin and ALS type adhesins, but also wall mannoproteins). It misses short GPI wall proteins such as CFEM proteins, and it flags enzymes with a Ser/Thr-rich linker (for example chitinases)."
    reads: [step1_rule@R0, gpi, tm, disorder]
    status: derived from the leaf calls that decided each record
  - call: flocculin_like_candidate
    kind: composite
    gated: true
    category: cell wall and adhesion
    meaning: "The narrow AGA1-class flag: the broad flag and a repeat call of detector 14 (coverage 0.25 or more, 2.5 copies or more). It is stricter than the broad flag and misses adhesins whose repeats are not periodic. Detector 02 is not read."
    reads: [step1_rule@R0, gpi, tm, disorder, repeat14]
    status: derived from the leaf calls that decided each record
  - call: model_surface_candidate
    kind: composite
    gated: true
    category: cell wall and adhesion
    meaning: "At least 2 of 3 feature models (logistic regression, random forest, gradient boosting; trained on the labelled AGA1 proteins) score the protein at or above their threshold, and the protein has a signal peptide. The thresholds belong to a clade (data/sorting_hat/aga1_model_thresholds.tsv); outside Saccharomycotina the row is marked not calibrated, and the gradient boosting model over-called in non-yeast proteomes. The models were trained on the labelled proteins, so no measurement on them is independent."
    reads: [step1_rule@R0, aga1_model]
    status: unvalidated (the classifier was trained on the labelled proteins)
  - call: cocci_specificity_rank_top15
    kind: evidence
    gated: false
    category: antigen
    meaning: Top 15% of the Coccidioides genus-specificity ranking (C. immitis RS only). Not applicable (`not_applicable`) for every other protein. The same holds when the run has no `antigen_lookup` table (`species_limited` in categories.yaml). In a run with no table, a protein of taxon 246410 is `not_assessable`.
    reads: [antigen_lookup]
    status: unvalidated (the ranking prints NOT CALIBRATED)
  - call: serodiagnostic_marker_candidate
    kind: composite
    gated: true
    category: antigen
    meaning: Top 15% ranking and signal peptide. Never called where the ranking is not applicable.
    reads: [step1_rule@R0, antigen_lookup]
    status: derived from the leaf calls that decided each record
  - call: iuis_allergen_similarity
    kind: evidence
    gated: false
    category: allergen
    meaning: Similarity to a WHO/IUIS fungal allergen of at least 35% identity over 80 aa.
    reads: [allergen_homology]
    status: unvalidated
  - call: iuis_allergen_homolog
    kind: evidence
    gated: false
    category: allergen
    meaning: At least 70% identity over 80% of an allergen, or a hit to an allergen Pfam family. Both allergen families are inactive, so the Pfam branch is not assessable and the call is never not_called in practice.
    reads: [allergen_homology, pfam_allergen]
    status: unvalidated
  - call: other_not_surface
    kind: other
    gated: true
    category: other
    meaning: No signal peptide, with the mechanism calls not called. Not assessable when a mechanism input is unknown; a not applicable mechanism is skipped.
    reads: [step1_rule@R0]
    status: derived from the leaf calls that decided each record
  - call: other_surface_no_mechanism
    kind: other
    gated: true
    category: other
    meaning: Signal peptide and no mechanism evidence (repeat, wall family, hydrophobin, HsbA, antigen rank). Not assessable when a mechanism input is unknown; a not applicable mechanism is skipped. A protein with a mechanism and no signal peptide, or with a mechanism that no composite reads, has neither this call nor a composite; its `primary_label` is `mechanism_without_class`.
    reads: [step1_rule@R0]
    status: derived from the leaf calls that decided each record
modules_not_calls:
  - module: tm
    note: TMHMM; a condition for CFEM (no mature TM helix) and an evidence field.
  - module: cys_rich
    note: Cysteine-rich tiers (Coccidioides RS only); evidence field.
  - module: expression
    note: Spherule expression lookup (Coccidioides only); evidence field.
  - module: cys8_pattern
    note: Eight-cysteine spacing plus R0; experimental, read by no call.
  - module: hydrophobin_relaxed
    note: Relaxed hydrophobin level; experimental, read by no call (owner decision 2026-10-08, strict call only).
