[build-system]
requires = ["setuptools>=82.0.1", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

# Configuration for CLI scripts
# Script names carry the "surface_glyco_" prefix; see the [project.scripts] section entries

[project]
name = "surface_glyco"
description = "ESM-2 based scorer for fungal cell-surface glycoproteins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.85",
    "numpy>=2.0.2",
    "torch",
    "fair-esm",
    "scikit-learn",
    "tqdm",
    "torchvision",
    "scikit-posthocs>=0.7",
    "pandas",
    "scipy",
    "duckdb",
    "statsmodels",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "umap-learn",
    "pyyaml",
]
license = { file = "LICENSE" }
dynamic = ["version"]

[project.scripts]
surface_glyco_predict = "surface_glyco.scripts.predict:cli"
surface_glyco_train = "surface_glyco.scripts.train:cli"
surface_glyco_evaluate = "surface_glyco.scripts.evaluate:cli"
cellsurface_sorting_hat = "cellsurface_sorting_hat.cli:main"
cellsurface_sorting_hat_module = "cellsurface_sorting_hat.modules.cli:main"
cellsurface_sorting_hat_calibrate = "cellsurface_sorting_hat.calibration.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "N803", "N806", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["surface_glyco", "cellsurface_sorting_hat"]

[tool.setuptools_scm]
# Use git tags for versioning
# Will create versions like: 1.2.3 (if on tag) or 1.2.3.dev4+g1234567 (if after tag)
version_scheme = "release-branch-semver"
local_scheme = "dirty-tag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Include models directory and all files within it
"surface_glyco" = ["models/*"]
"cellsurface_sorting_hat" = ["categories.yaml"]
